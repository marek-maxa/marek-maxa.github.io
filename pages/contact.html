<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Marek Maxa</title>
    <script src="../scripts/darkmode.js"></script>
    <link rel="stylesheet" href="../assets/styles.css">
    <link rel="icon" href="../assets/venus.ico" type="image/x-icon">
</head>
<body>
    <div id="navbar"></div>
    <main>
        <section class="contact-hero">
            <h1>Kontaktujte mě</h1>
            <p class="contact-subtitle">Máte dotaz nebo nabídku spolupráce? Neváhejte mě kontaktovat.</p>
        </section>

        <div class="contact-grid">
            <section class="contact-form-section">
                <h2>Napište mi</h2>
                <form class="contact-form" action="https://formspree.io/f/your-form-id" method="POST">
                    <div class="form-group">
                        <label for="name">Jméno</label>
                        <input type="text" id="name" name="name" required>
                    </div>
                    <div class="form-group">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="message">Zpráva</label>
                        <textarea id="message" name="message" rows="5" required></textarea>
                    </div>
                    <button type="submit" class="cta-button primary">Odeslat zprávu</button>
                </form>
            </section>

            <section class="contact-info">
                <div class="contact-card">
                    <h2>Spojte se se mnou</h2>
                    <div class="contact-methods">
                        <a href="mailto:maxamarek1@gmail.cz" class="contact-method">
                            <span class="contact-icon">📧</span>
                            <div class="contact-details">
                                <h3>E-mail</h3>
                                <p>maxamarek1@gmail.cz</p>
                            </div>
                        </a>
                        <a href="https://www.linkedin.com/in/marek-maxa-56b01a36a/" target="_blank" class="contact-method">
                            <span class="contact-icon">💼</span>
                            <div class="contact-details">
                                <h3>LinkedIn</h3>
                                <p>Sledujte mou profesní cestu</p>
                            </div>
                        </a>
                        <a href="https://github.com/marek-maxa" target="_blank" class="contact-method">
                            <span class="contact-icon">💻</span>
                            <div class="contact-details">
                                <h3>GitHub</h3>
                                <p>Prohlédněte si mé projekty</p>
                            </div>
                        </a>
                    </div>
                </div>
            </section>
        </div>
    </main>
    <div id="footer"></div>
    <script src="../scripts/components.js"></script>
</body>
</html>
